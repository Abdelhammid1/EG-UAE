{% extends "base.html" %}
{% block title %}تالف / فقد — منصتي{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('inventory.warehouses') }}" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">→</a>
    <div><h1 class="text-2xl font-bold">تسجيل تالف / فقد</h1>
      <p class="text-slate-500 text-sm">ينقص المخزون ويُنشئ قيد خسارة. يتطلب سببًا.</p></div>
  </div>
  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label class="block text-sm font-medium mb-1.5">المنتج</label>
      <select name="product_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none">{% for p in products %}<option value="{{ p.id }}">{{ p.name_ar }}</option>{% endfor %}</select></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium mb-1.5">المخزن</label>
        <select name="warehouse_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none">{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name_ar }}</option>{% endfor %}</select></div>
      <div><label class="block text-sm font-medium mb-1.5">الكمية</label>
        <input name="qty" inputmode="decimal" class="w-full text-end rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500"></div>
    </div>
    <div><label class="block text-sm font-medium mb-1.5">السبب</label>
      <input name="reason" required placeholder="مثال: كسر أثناء النقل" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"></div>
    <button class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg">تسجيل التالف</button>
  </form>
</div>
{% endblock %}
