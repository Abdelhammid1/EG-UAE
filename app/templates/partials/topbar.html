<header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800
               flex items-center gap-3 px-4 sm:px-6 sticky top-0 z-20">
  <button @click="sidebar = !sidebar"
          class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">☰</button>

  <div class="flex-1"></div>

  <!-- language toggle -->
  <div class="flex items-center rounded-lg border border-slate-200 dark:border-slate-700 text-sm overflow-hidden">
    <a href="{{ url_for('auth.set_language', lang='ar') }}"
       class="px-3 py-1.5 {% if locale=='ar' %}bg-brand-600 text-white{% else %}text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">ع</a>
    <a href="{{ url_for('auth.set_language', lang='en') }}"
       class="px-3 py-1.5 {% if locale=='en' %}bg-brand-600 text-white{% else %}text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}">EN</a>
  </div>

  <!-- dark mode -->
  <button onclick="document.documentElement.classList.toggle('dark')"
          class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">🌓</button>

  <!-- user menu -->
  <div class="flex items-center gap-3 ps-3 border-s border-slate-200 dark:border-slate-700"
       x-data="{ open: false }">
    <div class="text-end">
      <div class="text-sm font-semibold leading-tight">{{ current_user.full_name }}</div>
      <div class="text-xs text-slate-400">
        {% for r in current_user.roles %}{{ r.name_ar }}{% if not loop.last %} · {% endif %}{% endfor %}
      </div>
    </div>
    <div class="w-9 h-9 rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300 grid place-items-center font-bold">
      {{ current_user.full_name[0] }}
    </div>
    <a href="{{ url_for('manage.twofa') }}"
       class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500" title="المصادقة الثنائية">🔒</a>
    <a href="{{ url_for('auth.change_password') }}"
       class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500" title="تغيير كلمة المرور">🔑</a>
    <a href="{{ url_for('auth.logout') }}"
       class="p-2 rounded-lg hover:bg-red-50 hover:text-red-600 text-slate-500" title="تسجيل الخروج">⏻</a>
  </div>
</header>
