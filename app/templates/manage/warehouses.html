{% extends "base.html" %}
{% block title %}المخازن — منصتي{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="text-2xl font-bold">المخازن</h1><p class="text-slate-500 text-sm">أضف مخزنًا لأي فرع.</p></div>
<div class="grid lg:grid-cols-2 gap-6">
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden" style="box-shadow:var(--sh)">
    <table class="w-full text-sm"><thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 text-xs"><tr><th class="text-start px-4 py-3">المخزن</th><th class="text-start px-4 py-3">الفرع</th></tr></thead>
    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
      {% for w in items %}<tr><td class="px-4 py-2.5 font-medium">{{ w.name_ar }}</td><td class="px-4 py-2.5">{{ w.branch.name_ar }}</td></tr>{% endfor %}
    </tbody></table>
  </div>
  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 space-y-3 h-fit" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="font-semibold">إضافة مخزن</div>
    <input name="name_ar" placeholder="اسم المخزن" required class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none">
    <select name="branch_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none">{% for b in branches %}<option value="{{ b.id }}">{{ b.name_ar }}</option>{% endfor %}</select>
    <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg">إضافة</button>
  </form>
</div>
{% endblock %}
