{% extends "base.html" %}
{% block title %}ربط الحسابات — منصتي{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="text-2xl font-bold">ربط العمليات بالحسابات</h1>
  <p class="text-slate-500 text-sm">حدّد الحساب المحاسبي لكل عملية تلقائية (بيع، شراء، فروق عملة...).</p></div>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-w-2xl" style="box-shadow:var(--sh)">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 text-xs"><tr><th class="text-start px-4 py-3">العملية</th><th class="text-start px-4 py-3">الحساب</th></tr></thead>
      <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
        {% for m in maps %}
          <tr><td class="px-4 py-2 latin-nums text-slate-500">{{ m.operation_code }}</td>
            <td class="px-4 py-2"><select name="map_{{ m.id }}" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-2 py-1.5 text-sm outline-none">
              {% for a in accounts %}<option value="{{ a.id }}" {% if a.id==m.account_id %}selected{% endif %}>{{ a.code }} · {{ a.name_ar }}</option>{% endfor %}
            </select></td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <div class="mt-4"><button class="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold">حفظ</button></div>
</form>
{% endblock %}
