{% extends "base.html" %}
{% block title %}تغيير كلمة المرور — منصتي{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold">تغيير كلمة المرور</h1>
    {% if forced %}<p class="text-amber-600 text-sm">يلزم تغيير كلمة المرور المؤقتة قبل المتابعة.</p>{% endif %}
  </div>
  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label class="block text-sm font-medium mb-1.5">كلمة المرور الحالية</label>
      <input type="password" name="current_password" required class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"></div>
    <div><label class="block text-sm font-medium mb-1.5">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
      <input type="password" name="new_password" required class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"></div>
    <div><label class="block text-sm font-medium mb-1.5">تأكيد كلمة المرور</label>
      <input type="password" name="confirm_password" required class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"></div>
    <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg">حفظ</button>
  </form>
</div>
{% endblock %}
