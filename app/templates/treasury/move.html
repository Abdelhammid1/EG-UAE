{% extends "base.html" %}
{% block title %}إيداع/سحب — {{ entity.name_ar }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto" x-data="{op:'deposit'}">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('treasury.statement', kind=kind, eid=entity.id) }}" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">→</a>
    <div>
      <h1 class="text-2xl font-bold">إيداع / سحب</h1>
      <p class="text-slate-500 text-sm">{{ entity.name_ar }} · {{ entity.currency_code }}</p>
    </div>
  </div>

  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="op" :value="op">

    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
      <button type="button" @click="op='deposit'" :class="op=='deposit' ? 'bg-white dark:bg-slate-900 shadow text-green-700' : 'text-slate-500'" class="py-2 rounded-lg font-medium text-sm">إيداع (وارد)</button>
      <button type="button" @click="op='withdraw'" :class="op=='withdraw' ? 'bg-white dark:bg-slate-900 shadow text-red-600' : 'text-slate-500'" class="py-2 rounded-lg font-medium text-sm">سحب (صادر)</button>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1.5"><span x-text="op=='deposit' ? 'الحساب المصدر' : 'حساب الوجهة'"></span></label>
      <select name="counter_account_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500">
        <option value="">— اختر الحساب المحاسبي —</option>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} · {{ a.name_ar }}</option>{% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1.5">المبلغ ({{ entity.currency_code }})</label>
        <input name="amount" inputmode="decimal" placeholder="0.00" class="w-full text-end rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5">التاريخ</label>
        <input type="date" name="date" value="{{ today }}" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1.5">البيان</label>
      <input name="memo" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <button class="w-full text-white font-semibold py-2.5 rounded-lg"
            :class="op=='deposit' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'">
      <span x-text="op=='deposit' ? 'تسجيل الإيداع' : 'تسجيل السحب'"></span>
    </button>
    <p class="text-xs text-slate-400">تُنشئ الحركة قيدًا محاسبيًا إجباريًا — لا حركة مالية خارج السجل.</p>
  </form>
</div>
{% endblock %}
