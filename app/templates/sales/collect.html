{% extends "base.html" %}
{% block title %}تحصيل — منصتي{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('sales.customer_view', cid=customer.id) }}" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">→</a>
    <h1 class="text-2xl font-bold">تحصيل من {{ customer.name_ar }}</h1>
  </div>
  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label class="block text-sm font-medium mb-1.5">المبلغ ({{ customer.currency_code }})</label>
      <input name="amount" inputmode="decimal" class="w-full text-end rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500"></div>
    <div><label class="block text-sm font-medium mb-1.5">إلى</label>
      <select name="to_account_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500">
        {% for aid, lbl in sources %}<option value="{{ aid }}">{{ lbl }}</option>{% endfor %}</select></div>
    <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg">تسجيل التحصيل</button>
  </form>
</div>
{% endblock %}
