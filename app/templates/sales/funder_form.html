{% extends "base.html" %}
{% block title %}جهة تمويل جديدة — منصتي{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('sales.funders') }}" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">→</a>
    <h1 class="text-2xl font-bold">جهة تمويل جديدة</h1>
  </div>
  <form method="post" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 space-y-4" style="box-shadow:var(--sh)">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label class="block text-sm font-medium mb-1.5">الاسم (مثال: تابي / تمارا)</label>
      <input name="name_ar" required class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500"></div>
    <div class="grid grid-cols-3 gap-4">
      <div><label class="block text-sm font-medium mb-1.5">العملة</label>
        <select name="currency_code" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none">
          {% for c in currencies %}<option value="{{ c.code }}">{{ c.code }}</option>{% endfor %}</select></div>
      <div><label class="block text-sm font-medium mb-1.5">نسبة العمولة %</label>
        <input name="commission_pct" inputmode="decimal" value="0" class="w-full text-end rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500"></div>
      <div><label class="block text-sm font-medium mb-1.5">رسم ثابت</label>
        <input name="fixed_fee" inputmode="decimal" value="0" class="w-full text-end rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 latin-nums outline-none focus:ring-2 focus:ring-brand-500"></div>
    </div>
    <div><label class="block text-sm font-medium mb-1.5">الحساب البنكي للتسوية</label>
      <select name="bank_id" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 dark:bg-slate-900 px-3 py-2.5 text-sm outline-none">
        <option value="">— لاحقًا —</option>
        {% for b in banks %}<option value="{{ b.id }}">{{ b.name_ar }}</option>{% endfor %}</select></div>
    <div class="flex gap-2 pt-2">
      <button class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg">حفظ</button>
      <a href="{{ url_for('sales.funders') }}" class="px-6 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
